name: Radar Fintual (solo lectura)
run-name: "Radar ${{ inputs.trigger_source || github.event_name }} ${{ inputs.dispatch_slot || '' }}"
on:
  # Production cadence is owned by Supabase pg_cron (one cycle every five minutes).
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Origen del disparo; supabase exige reloj de mercado y slot vigente'
        required: true
        default: 'manual'
        type: choice
        options: ['manual', 'supabase']
      dispatch_slot:
        description: 'Slot UTC del programador externo (ISO 8601)'
        required: false
        type: string
      validation_cycles:
        description: 'Ciclos de prueba (3 = arranques separados por 5 minutos)'
        required: true
        default: '1'
        type: choice
        options: ['1', '3']
  push:
    paths:
      - 'actualizar_precios.py'
      - 'ejecutar_radar.py'
      - 'fuentes_primarias.py'
      - 'vigilancia.py'
      - 'tests/**'
      - 'supabase/**'
      - '.github/workflows/precios.yml'
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'push' && 'radar-fintual-pruebas' || 'radar-fintual-publicacion' }}
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas locales sin credenciales
        run: python -m unittest discover -s tests -v
      - name: Pruebas del monitor externo sin credenciales
        run: node --test tests/*.mjs
      - name: Verificar sesión de NY
        id: horario
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
          DISPATCH_SLOT: ${{ inputs.dispatch_slot || '' }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python - <<'PY'
          import datetime as d, os
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo
          t = d.datetime.now(ZoneInfo('America/New_York'))
          regular = t.weekday() < 5 and ((t.hour == 9 and t.minute >= 30) or 10 <= t.hour < 16)
          external = os.environ.get('TRIGGER_SOURCE') == 'supabase'
          enabled = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          if external:
              try:
                  slot = d.datetime.fromisoformat(os.environ['DISPATCH_SLOT'].replace('Z', '+00:00'))
                  age = (d.datetime.now(d.timezone.utc) - slot).total_seconds()
                  enabled = enabled and regular and -30 <= age <= 240
              except (ValueError, TypeError):
                  enabled = False
          if enabled and external:
              try:
                  import json
                  req = Request('https://paper-api.alpaca.markets/v2/clock', headers={
                      'APCA-API-KEY-ID': os.environ['ALPACA_API_KEY_ID'],
                      'APCA-API-SECRET-KEY': os.environ['ALPACA_API_SECRET_KEY']})
                  with urlopen(req, timeout=12) as r:
                      enabled = json.load(r).get('is_open') is True
              except Exception as exc:
                  print('Market clock unavailable:', type(exc).__name__)
                  enabled = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"enabled={str(enabled).lower()}\n")
          print('NY', t.isoformat(timespec='seconds'), 'event', os.environ['EVENT_NAME'], 'scan', enabled)
          PY
      - name: Explorar universo y persistir cada ciclo
        if: steps.horario.outputs.enabled == 'true'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          GITHUB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          VALIDATION_CYCLES: ${{ inputs.trigger_source == 'supabase' && '1' || inputs.validation_cycles || '1' }}
        run: python ejecutar_radar.py
